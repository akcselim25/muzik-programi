name: Build Android APK

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    name: Build & Release Aurns APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Accept Android Licenses
        run: |
          yes | sdkmanager --licenses || true

      - name: Build Android Release APK
        working-directory: ./android
        run: |
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Prepare APK File
        run: |
          find android/app/build/outputs/apk/ -name "*.apk" -type f
          cp android/app/build/outputs/apk/release/app-release.apk Aurns.apk || cp $(find android/app/build/outputs/apk/ -name "*.apk" | head -n 1) Aurns.apk
          ls -lh Aurns.apk

      - name: Upload APK as Workflow Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Aurns-Android-v1.1.0
          path: Aurns.apk
          retention-days: 30

      - name: Attach APK to GitHub Release v1.1.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload v1.1.0 Aurns.apk --clobber || echo "Release upload skipped or failed"
